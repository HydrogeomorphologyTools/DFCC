[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dfcc"
version = "0.4.0"
description = "DFCC - Debris-Flow Channel Classification: debris-flow propensity of the channel network, initiation density and morphometric runout (stand-alone implementation of Procedura DF)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-2.0-or-later" }
authors = [
  { name = "Stefano Crema", email = "stefano.crema@cnr.it" },
  { name = "Marco Cavalli", email = "marco.cavalli@cnr.it" },
  { name = "Alessandro Sarretta", email = "alessandro.sarretta@cnr.it" },
]
maintainers = [{ name = "Stefano Crema", email = "stefano.crema@cnr.it" }]
keywords = ["debris flow", "geomorphology", "hydrology", "DTM", "TauDEM", "runout", "sediment connectivity"]
dependencies = ["numpy>=1.21", "numba>=0.56", "rasterio>=1.3", "pyshp>=2.3"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)",
  "Topic :: Scientific/Engineering :: GIS",
]

[project.urls]
Homepage = "https://github.com/HydrogeomorphologyTools/DFCC"
Issues = "https://github.com/HydrogeomorphologyTools/DFCC/issues"

[project.optional-dependencies]
gui = ["PySide6>=6.5", "matplotlib>=3.6"]
test = ["pytest"]

[project.scripts]
dfcc = "dfcc.cli:main"
dfcc-gui = "dfcc.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"dfcc.gui" = ["help/*.png"]
