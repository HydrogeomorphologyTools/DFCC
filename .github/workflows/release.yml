name: release
# Builds the Windows executable and attaches it to the GitHub release when a tag v* is pushed
# (or run manually from the Actions tab to get the zip as a build artifact).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ".[gui,test]" pyinstaller
      - run: pytest -q
        env: { QT_QPA_PLATFORM: offscreen }
      - run: pyinstaller --noconfirm --distpath dist --workpath build packaging/dfcc.spec
        working-directory: .
      - run: dist\DFCC\DFCC.exe run --help
      - run: Compress-Archive -Path dist\DFCC -DestinationPath DFCC-windows.zip
      - uses: actions/upload-artifact@v4
        with: { name: DFCC-windows, path: DFCC-windows.zip }
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: DFCC-windows.zip
          prerelease: true
