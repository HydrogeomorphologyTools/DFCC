name: release
# Optional: builds the Windows executable on GitHub and attaches it to an existing release.
# Run manually from the Actions tab, giving the tag. Release exes can also be built locally (packaging/build_exe.bat)
# and uploaded by hand. Tests run in the separate 'tests' workflow.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach the zip to"
        default: "v0.4.0"
permissions:
  contents: write
jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ".[gui,test]" pyinstaller
      - run: pyinstaller --noconfirm --distpath dist --workpath build packaging/dfcc.spec
        working-directory: .
      - run: dist\DFCC\DFCC.exe run --help
      - run: Compress-Archive -Path dist\DFCC -DestinationPath DFCC-windows.zip
      - run: pyinstaller --noconfirm --distpath dist_onefile --workpath build_onefile packaging/dfcc_onefile.spec
      - run: dist_onefile\DFCC.exe --version
      - uses: actions/upload-artifact@v4
        with:
          name: DFCC-windows
          path: |
            DFCC-windows.zip
            dist_onefile/DFCC.exe
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag }}
          files: |
            DFCC-windows.zip
            dist_onefile/DFCC.exe
          prerelease: true
